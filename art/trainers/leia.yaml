name: leia
kit: trainer64
replaces: graphics/trainers/front_pics/steven.png
# Leia replaces Steven (emerald-sw-db swap_map: character:steven-stone -> LEIA).
# Pose brief: 3/4 toward the player, weight on the near leg, hip out; far arm extended with the
# blaster aimed at the player, near hand on her hip; white gown with a curved hem, both shoe
# tips showing (far one in profile, near one toe-on); side buns, the near bun big.
palette:
  - [115, 197, 164]  # 0 transparent
  - [24, 24, 40]     # K outline
  - [144, 152, 184]  # a gown shadow
  - [208, 216, 224]  # b gown base
  - [248, 248, 248]  # c gown highlight
  - [184, 120, 96]   # d skin shadow
  - [232, 176, 136]  # e skin base
  - [248, 216, 184]  # f skin highlight
  - [64, 32, 24]     # g hair shadow
  - [112, 64, 40]    # h hair base
  - [168, 112, 64]   # i hair highlight
  - [88, 88, 104]    # j metal shadow
  - [152, 152, 168]  # k metal base
  - [200, 64, 72]    # r lips
legend: {'.': 0, K: 1, a: 2, b: 3, c: 4, d: 5, e: 6, f: 7, g: 8, h: 9, i: 10, j: 11, k: 12, r: 13}
frames:
  front:
    rig:
      joints:
        head: [28, 11]
        sh_far: [24, 21]
        sh_near: [35, 22]
        el_far: [17, 23]
        hand_far: [11, 22]
        el_near: [41, 29]
        hand_near: [36, 33]
      layers:
        - {name: far bun, shape: ellipse, at: [21, 12], r: [3, 3.5], ramp: ghi}
        - {name: gown skirt, shape: poly, pts: [[25, 31], [36, 33], [40, 42], [45, 56], [42, 60], [32, 62], [22, 61], [16, 58], [21, 44]], ramp: abc}
        - {name: far shoe, shape: poly, pts: [[22, 59], [22, 62], [14, 62], [15, 60]], ramp: jjk}
        - {name: near shoe, shape: ellipse, at: [37, 62], r: [3.5, 2], angle: -15, ramp: jjk}
        - {name: hem, shape: poly, pts: [[17, 58], [22, 60], [32, 61], [42, 59], [44, 57], [42, 60], [32, 62], [22, 61], [16, 59]], ramp: aab}
        - {name: torso, shape: poly, pts: [[23, 20], [36, 21], [36, 28], [35, 34], [26, 33], [25, 27]], ramp: abc}
        - {name: belt, shape: poly, pts: [[25, 29], [30, 30], [37, 32], [37, 35], [30, 34], [25, 33]], ramp: jkk}
        - {name: near arm, shape: capsule, from: sh_near, to: el_near, r: [3, 2.5], ramp: abc}
        - {name: near forearm, shape: capsule, from: el_near, to: hand_near, r: [2.5, 2.5], ramp: abc}
        - {name: near hand, shape: ellipse, at: hand_near, r: [2, 2], ramp: def}
        - {name: neck, shape: capsule, from: [29, 16], to: [29, 20], r: [2, 2], ramp: dde}
        - {name: face, shape: ellipse, at: head, r: [5, 6], ramp: def}
        - {name: hair cap, shape: poly, pts: [[22, 9], [24, 5], [29, 4], [34, 6], [35, 11], [34, 14], [31, 9], [26, 8], [23, 11]], ramp: ghi}
        - {name: near bun, shape: ellipse, at: [36, 12], r: [3.5, 4], ramp: ghi}
        - {name: eyes and mouth, shape: pixels, x: 23, y: 11, rows: "_K___KK\n_K___Kf\n__d____\n_______\n__dr___"}
        - {name: hair part, shape: pixels, x: 27, y: 5, rows: "ii\n_i"}
        - {name: far arm, shape: capsule, from: sh_far, to: el_far, r: [3, 2.5], ramp: abc}
        - {name: far forearm, shape: capsule, from: el_far, to: hand_far, r: [2.5, 2], ramp: abc}
        - {name: far hand, shape: ellipse, at: hand_far, r: [2, 2], ramp: def}
        - {name: blaster, shape: poly, pts: [[12, 20], [4, 20], [3, 22], [8, 22], [10, 25], [12, 24]], ramp: jjk}
    patches:
      - {x: 38, y: 9, rows: "i"}
      - {x: 27, y: 25, rows: "c"}
      - {x: 33, y: 46, rows: "a\na\na"}
      - {x: 26, y: 48, rows: "a\na\na\na"}
      - {x: 38, y: 50, rows: "a\na\na"}
      - {x: 20, y: 52, rows: "c\nc"}
