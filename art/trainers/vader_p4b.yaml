name: vader_p4b
kit: trainer64
replaces: graphics/trainers/front_pics/magma_leader_maxie.png
# Darth Vader replaces Maxie (emerald-sw-db swap_map: character:maxie -> VADER).
# Picked style (round 3). Pose 4b "salute" with perspective (round 3): high 3/4 camera. Far boot in profile and set
# higher, near boot toe-on and lowest; belt and helmet flare slope down to the near side;
# torso centre line toward the far side; cape hem curved.
palette:
  - [115, 197, 164]  # 0 transparent
  - [16, 16, 24]     # K outline
  - [24, 24, 40]     # c deepest shadow (inside the cape)
  - [48, 56, 88]     # d armour shadow
  - [80, 96, 136]    # m armour base
  - [136, 160, 208]  # h highlight
  - [200, 216, 240]  # s sheen
  - [96, 96, 112]    # g metal dark
  - [168, 168, 184]  # G metal light
  - [96, 40, 56]     # l lens
  - [216, 48, 40]    # r red light
  - [72, 200, 96]    # e green light
  - [64, 128, 232]   # b blue light
  - [248, 64, 48]    # R saber glow
  - [248, 240, 240]  # W saber core
legend: {'.': 0, K: 1, c: 2, d: 3, m: 4, h: 5, s: 6, g: 7, G: 8, l: 9, r: 10, e: 11, b: 12, R: 13, W: 14}
frames:
  front:
    rig:
      joints:
        head: [26, 9]
        sh_far: [23, 19]
        sh_near: [38, 22]
        el_far: [17, 28]
        hand_far: [22, 31]
        el_near: [41, 31]
        hand_near: [27, 32]
        hip_far: [27, 38]
        hip_near: [35, 39]
        kn_far: [22, 47]
        ank_far: [19, 55]
        kn_near: [37, 49]
        ank_near: [40, 58]
      layers:
        # cape: hem is a curve seen from above (lower in front), lining shows on the far edge
        - {name: cape, shape: poly, pts: [[22, 17], [38, 17], [48, 29], [55, 50], [55, 59], [48, 62], [36, 63], [20, 62], [10, 59], [11, 44], [17, 27]], ramp: ccd}
        - {name: cape lining, shape: poly, pts: [[12, 46], [17, 33], [16, 50], [13, 58], [10, 58]], ramp: c, outline: none}
        - {name: far thigh, shape: capsule, from: hip_far, to: kn_far, r: [4, 3], ramp: dmm}
        - {name: far shin, shape: capsule, from: kn_far, to: ank_far, r: [3, 2.5], ramp: dmm}
        # far boot in profile, toe pointing left (toward the player), set higher on the ground
        - {name: far boot, shape: poly, pts: [[21, 53], [21, 58], [19, 59], [11, 59], [10, 57], [13, 55], [16, 54]], ramp: dmh}
        - {name: near thigh, shape: capsule, from: hip_near, to: kn_near, r: [4.5, 3.5], ramp: dmh}
        - {name: near shin, shape: capsule, from: kn_near, to: ank_near, r: [3.5, 3], ramp: dmh}
        # near boot: toe turned toward the camera, short and wide, lowest point of the figure
        - {name: near boot, shape: ellipse, at: [40, 61], r: [4.5, 2.5], angle: -15, ramp: dmh}
        # torso: near side wider, centre line pushed toward the far side
        - {name: torso, shape: poly, pts: [[22, 18], [39, 19], [39, 30], [37, 39], [26, 38], [24, 29]], ramp: dmh}
        # belt follows the body: slopes down toward the near side and curves
        - {name: belt, shape: poly, pts: [[25, 31], [30, 32], [38, 34], [38, 37], [30, 35], [25, 34]], ramp: gGG}
        - {name: near arm, shape: capsule, from: sh_near, to: el_near, r: [4.5, 3.5], ramp: dmh}
        - {name: near forearm, shape: capsule, from: el_near, to: hand_near, r: [3, 3], ramp: dmh}
        - {name: near fist, shape: ellipse, at: hand_near, r: [3, 3], ramp: dmh}
        # helmet: flare bottom edge slopes down to the near/back side, dome tilted with the head
        - {name: helmet flare, shape: poly, pts: [[17, 12], [36, 10], [42, 18], [37, 22], [22, 20], [16, 17]], ramp: dmh}
        - {name: helmet dome, shape: ellipse, at: head, r: [8, 6.5], angle: -12, ramp: dmh}
        - {name: face, shape: pixels, x: 14, y: 9, rows: "__KKKKKKKKKK\n_KllKhKKllllK\nKslKKdKslllK_\nKlKKdddKllKK_\n_KdgggdKKd___\n_KdgGggdK____\n_KggGggK_____\n__KgggK______\n___KKK_______"}
        - {name: face, shape: pixels, x: 20, y: 4, rows: "_ss\ns__"}
        - {name: far arm, shape: capsule, from: sh_far, to: el_far, r: [3.5, 3], ramp: dmh}
        - {name: far forearm, shape: capsule, from: el_far, to: hand_far, r: [3, 3], ramp: dmh}
        - {name: far fist, shape: ellipse, at: hand_far, r: [3, 3], ramp: dmh}
        - {name: blade, shape: capsule, from: [23, 27], to: [11, 1], r: [1.5, 1.5], ramp: W, outline: R}
        - {name: hilt, shape: capsule, from: [25, 33], to: [23, 28], r: [1, 1], ramp: gG}
    patches:
      # chest box sits on the turned chest plane, toward the far side, skewed
      - {x: 26, y: 22, rows: "KKKKK_\nKGrebK\nKGbrGK\n_KKKKK"}
      - {x: 28, y: 32, rows: "KKKK\nKsGK\nKGgK\nKKKK"}
      # knee and boot glints, fold lines in the cape
      - {x: 36, y: 47, rows: "s"}
      - {x: 38, y: 59, rows: "s"}
      - {x: 13, y: 56, rows: "h"}
      - {x: 47, y: 40, rows: "d\n_\nd\nd"}
