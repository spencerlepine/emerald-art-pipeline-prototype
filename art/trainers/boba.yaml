name: boba
kit: trainer64
replaces: graphics/trainers/front_pics/aqua_admin_m.png
# Boba Fett replaces Matt (Aqua Admin M) (emerald-sw-db swap_map: character:matt -> BOBA FETT).
# Pose brief: 3/4 toward the player, wide braced stance (near leg forward, boot toe-on and
# lowest; far leg back, boot in profile and higher), EE-3 carbine held in both hands across
# the body and aimed down-left at the player; jetpack behind, rangefinder up on the near side.
palette:
  - [115, 197, 164]  # 0 transparent
  - [16, 16, 24]     # K outline / visor
  - [40, 64, 48]     # a armour shadow
  - [72, 104, 72]    # b armour base
  - [128, 160, 104]  # c armour highlight
  - [64, 64, 72]     # d suit shadow
  - [104, 104, 112]  # e suit base
  - [160, 160, 168]  # f suit highlight
  - [176, 48, 40]    # r red
  - [216, 184, 72]   # y yellow
  - [88, 64, 40]     # P cape shadow
  - [136, 104, 64]   # Q cape base
  - [232, 232, 224]  # s sheen
legend: {'.': 0, K: 1, a: 2, b: 3, c: 4, d: 5, e: 6, f: 7, r: 8, y: 9, P: 10, Q: 11, s: 12}
