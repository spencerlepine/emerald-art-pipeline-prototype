  - [48, 56, 88]     # d armour shadow
  - [80, 96, 136]    # m armour base
  - [136, 160, 208]  # h highlight
  - [200, 216, 240]  # s sheen
  - [96, 96, 112]    # g metal dark
  - [168, 168, 184]  # G metal light
  - [96, 40, 56]     # l lens
  - [216, 48, 40]    # r red light
  - [72, 200, 96]    # e green light
  - [64, 128, 232]   # b blue light
  - [248, 64, 48]    # R saber glow
  - [248, 240, 240]  # W saber core
