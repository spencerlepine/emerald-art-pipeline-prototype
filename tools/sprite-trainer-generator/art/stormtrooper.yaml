name: stormtrooper
kit: trainer64
replaces: graphics/trainers/front_pics/magma_grunt_m.png
# Stormtrooper (m) replaces the Team Magma grunt (emerald-sw-db pending_art: STORMTROOPER (m)).
# Repaint of the grunt itself: wide aggressive stance, near arm thrust at the player, hood that
# already has a helmet's dome. Changes: red hoodie and grey trousers -> white armour with
# blue-grey shadows, skin -> black body glove, face -> helmet face plate (lenses, grill,
# cheek tubes), Poke Ball -> E-11 blaster held up in the far hand.
palette:
  - [115, 197, 164]  # 0 transparent
  - [16, 16, 24]     # K outline
  - [48, 48, 64]     # a body glove light
  - [96, 104, 128]   # b armour deep shadow
  - [152, 160, 184]  # c armour shadow
  - [208, 216, 232]  # d armour base
  - [248, 248, 248]  # e armour highlight
  - [32, 32, 40]     # f body glove
  - [72, 72, 80]     # g blaster metal
  - [128, 128, 136]  # h blaster light
  - [64, 96, 168]    # i blue tube
legend: {'.': 0, K: 1, a: 2, b: 3, c: 4, d: 5, e: 6, f: 7, g: 8, h: 9, i: 10}
frames:
  front:
    repaint:
      pic: graphics/trainers/front_pics/magma_grunt_m.png
      # grunt: 1-4 skin, 5/6/8 grey trousers (8 also hood shadow, belt), 10/13/12 red hoodie
      # dark->light, 11/14 ball whites, 15 outline
      remap: {1: a, 2: a, 3: f, 4: f, 5: e, 6: d, 8: b, 10: c, 11: d, 12: e, 13: d, 14: e, 15: K}
    rig:
      layers:
        # the ball and fist in the far hand -> black glove
        - {name: far glove, shape: poly, pts: [[45, 17], [55, 17], [55, 28], [45, 28]], recolour: "e:f d:f c:a b:a"}
        - {name: blaster, shape: capsule, from: [47, 23], to: [53, 9], r: [1.3, 1.1], ramp: fgh}
        - {name: blaster mag, shape: capsule, from: [50, 18], to: [54, 19], r: [0.7, 0.7], ramp: g}
        # the grey cuff on the near hand -> black glove
        - {name: near glove, shape: poly, pts: [[7, 28], [15, 28], [15, 36], [7, 36]], recolour: "e:a d:a c:f b:f"}
        # forearm between the sleeve and the glove: white armour, not bare body glove
        - {name: forearm, shape: poly, pts: [[16, 23], [24, 23], [24, 31], [16, 31]], recolour: "a:d f:c"}
        # hood and face -> stormtrooper helmet (dome, brow, lenses, nose ridge, grill, cheek tubes)
        - {name: old head, shape: poly, pts: [[21, 5], [43, 5], [43, 15], [40, 16], [40, 27], [23, 27], [21, 16]], erase: true}
        - {name: helmet, shape: pixels, x: 23, y: 7, rows: "_____KKKKKKK______\n___KKeeeeeeddKK___\n__KeeeeeeeeddddK__\n_KeeeeeeeeedddddK_\n_KeeeeeeeedddddcK_\nKeeeeeeeddddddcccK\nKeeeeeeddddddccccK\nKdddddddddddccccbK\nKdddddddddcccccbbK\nKeeKKKKeedddKKKKbK\nKdeKKKKKeddKKKKcbK\nKddeKKKdgddKKKdcbK\nKdddeKddgdddKddcbK\nKddddddcgcdddddcbK\nKdddddKdddKdddccbK\nKdiddKgKgKgKddicbK\n_KdidKKKKKKdicbK__\n_KdddddddddddccbK_\n__KddddddddddcbK__\n_KcbKKddddddKKbcK_\n_KKK_fKKKKKKf_KKK_"}
        # hoodie collar under the helmet -> chest plate shadow, then restore the silhouette outline
        - {name: chest, shape: poly, pts: [[25, 28], [40, 28], [40, 35], [25, 35]], recolour: "K:c f:b a:b"}
        - {name: chest outline, shape: edge, chars: "bc", to: K}
