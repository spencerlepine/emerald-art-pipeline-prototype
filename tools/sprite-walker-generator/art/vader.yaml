name: vader
description: "Darth Vader overworld walker (replaces Maxie, the Team Magma boss). Helmet: Round dome with a pinch at the temples and a skirt that flares out past the shoulders; big angled lenses, grey grill."
kit: person16x32
replaces: graphics/object_events/pics/people/team_magma/maxie.png
graphics_info: Maxie
# Maxie ships on NPC_2 (reds/oranges). Vader needs blacks and greys, which NPC_4 already has,
# so he moves palettes instead of adding one (see DECISIONS.md, D6).
palette: npc_4
palette_tag: OBJ_EVENT_PAL_TAG_NPC_4

# npc_4.pal indices. 1-4 are the shared skin ramp every NPC palette carries.
# Emerald never draws "black" clothes black: it uses a dark blue-grey ramp outlined in pure
# black (see Steven, Juan, the Aqua grunts). Vader follows that convention, so K (outline)
# and s/b/h (armour) stay separable at 1x.
legend:
  ".": 0    # transparent
  "K": 15   # 0 0 0        outline, eye lenses, boots
  "s": 7    # 8 16 32      armour/cape shadow
  "b": 6    # 57 74 98     armour/cape base
  "h": 5    # 106 139 172  armour highlight (light from the upper left)
  "d": 13   # 65 65 82     gloves
  "g": 12   # 139 139 148  grill, belt, chest box
  "G": 11   # 213 213 213  grill and buckle highlight
  "r": 9    # 164 65 115   chest-box light
  "p": 8    # 213 115 164  chest-box light (bright)

